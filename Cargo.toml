[package]
name = "caixa"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "6"
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
url = "2"

[[bin]]
name = "cx"
path = "src/main.rs"
